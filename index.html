              <a
                href="#music"
                class="inline-flex min-h-12 items-center justify-center rounded border border-amber-300/70 px-6 py-3 text-sm font-semibold uppercase tracking-[0.16em] text-amber-100 transition hover:bg-amber-300/20 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-amber-300 focus-visible:ring-offset-2 focus-visible:ring-offset-neutral-950"
